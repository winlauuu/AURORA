<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>AURORA · Share Location</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {

            margin: 0;

            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;

            font-family:
                Arial,
                sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #faf7f2,
                    #eee6dc
                );

            color: #3b3430;

        }

        .location-card {

            width: min(
                90%,
                460px
            );

            padding: 40px 30px;

            text-align: center;

            background: rgba(
                255,
                255,
                255,
                0.75
            );

            border-radius: 24px;

            box-shadow:
                0 20px 60px
                rgba(0,0,0,0.08);

        }

        h1 {

            margin-bottom: 10px;

            font-family:
                Georgia,
                serif;

            font-weight: 500;

        }

        p {

            line-height: 1.7;

            opacity: 0.75;

        }

        button {

            margin-top: 25px;

            padding:
                15px 25px;

            border: none;

            border-radius: 999px;

            background: #3b3430;

            color: white;

            font-size: 14px;

            cursor: pointer;

        }

        button:disabled {

            opacity: 0.5;

            cursor: default;

        }

        #status {

            margin-top: 25px;

            font-size: 14px;

        }

        #coordinates {

            margin-top: 10px;

            font-size: 12px;

            opacity: 0.6;

        }

    </style>

</head>


<body>

    <div class="location-card">

        <h1>AURORA</h1>

        <p>
            Share your current location
            with AURORA.
        </p>

        <button id="startLocation">
            Start Sharing Location
        </button>

        <div id="status">
            Location sharing is off.
        </div>

        <div id="coordinates"></div>

    </div>


    <!-- Firebase -->

    <script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-app-compat.js"></script>

    <script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-database-compat.js"></script>


    <script>

        const firebaseConfig = {

            apiKey:
                "AIzaSyCQbxoG3mTQeyM857syQrWEVz0Cqk3uK4",

            authDomain:
                "aurora-810a3.firebaseapp.com",

            projectId:
                "aurora-810a3",

            storageBucket:
                "aurora-810a3.firebasestorage.app",

            messagingSenderId:
                "17674409166",

            appId:
                "1:17674409166:web:19e3e5d090abe5dd1dec9f",

            measurementId:
                "G-9CL5V2SVXV",

            databaseURL:
                "https://aurora-810a3-default-rtdb.asia-southeast1.firebasedatabase.app"

        };


        firebase.initializeApp(
            firebaseConfig
        );


        const database =
            firebase.database();


        const locationRef =
            database.ref(
                "icatLocation"
            );


        const button =
            document.getElementById(
                "startLocation"
            );

        const status =
            document.getElementById(
                "status"
            );

        const coordinates =
            document.getElementById(
                "coordinates"
            );


        let watchId = null;


        button.addEventListener(
            "click",
            () => {

                if (
                    !navigator.geolocation
                ) {

                    status.textContent =
                        "This device does not support GPS.";

                    return;

                }


                button.disabled = true;

                status.textContent =
                    "Requesting location permission...";


                watchId =
                    navigator.geolocation.watchPosition(

                        async (position) => {

                            const latitude =
                                position.coords.latitude;

                            const longitude =
                                position.coords.longitude;


                            coordinates.textContent =
                                `${latitude.toFixed(6)}, ${longitude.toFixed(6)}`;


                            status.textContent =
                                "Location sharing is active.";


                            try {

                                await locationRef.set({

                                    latitude:
                                        latitude,

                                    longitude:
                                        longitude,

                                    accuracy:
                                        position.coords.accuracy,

                                    updatedAt:
                                        Date.now(),

                                    city:
                                        "Current Location"

                                });

                            } catch (error) {

                                console.error(
                                    error
                                );

                                status.textContent =
                                    "Unable to update location.";

                            }

                        },

                        (error) => {

                            console.error(
                                error
                            );

                            button.disabled =
                                false;

                            status.textContent =
                                "Location permission was not granted.";

                        },

                        {

                            enableHighAccuracy:
                                true,

                            maximumAge:
                                10000,

                            timeout:
                                15000

                        }

                    );

            }

        );

    </script>

</body>

</html>
